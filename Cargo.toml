[package]
name = "deepcopy"
version = "0.1.2"
edition = "2021"
authors = ["Adam Kent<adam.dkent@icloud.com>"]
repository = "https://github.com/lo9ud/deepcopy"
description = "A simple tool to copy files and directories recursively, and report current progress."
license = "MIT"

[dependencies]
clap = { version = "4.5.17", features = ["derive"] }
indicatif = "0.17.8"
num_cpus = "1.16.0"
sha2 = "0.10.8"
termsize = "0.1.9"
threadpool = "1.8.1"
walkdir = "2.5.0"
